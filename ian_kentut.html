<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#170008">
<title>ian kambing i hate u ❤️</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 100%; min-height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(ellipse at center, #39000f 0%, #190008 52%, #080004 100%);
    color: #ffd9e2; font-family: Georgia, serif;
    display: grid; place-items: center;
  }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
  .message {
    position: relative; z-index: 2; width: min(92vw, 680px);
    text-align: center; padding: 24px 12px; pointer-events: none;
    animation: appear 2s ease both;
  }
  h1 {
    margin: 0; font-size: clamp(25px, 7vw, 54px); line-height: 1.15;
    color: #ffe7ed; text-shadow: 0 0 8px #ff8aa8, 0 0 22px #ff174f, 0 0 48px #e6003c;
    animation: pulse 1.4s ease-in-out infinite;
  }
  p {
    margin: 18px 0 0; color: #ff9db4; font: 600 clamp(12px, 3vw, 17px) Arial, sans-serif;
    letter-spacing: 2px; text-shadow: 0 0 10px #ff174f;
  }
  .hint {
    position: fixed; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0;
    z-index: 3; text-align: center; color: #d78a9c; font: 12px Arial, sans-serif;
    opacity: .8; padding: 0 12px;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.055); } }
  @keyframes appear { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<canvas id="scene" aria-label="Animasi hati merah dengan tulisan ian kentut"></canvas>
<div class="message">
  <h1>ian kambing i hate u</h1>
  <p>♡ ian kentut · ian kentut · ian kentut ♡</p>
</div>
<div class="hint">sent with questionable affection ❤️</div>
<script>
(() => {
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, frame = 0, particles = [], stars = [], falling = [];
  const words = ['ian kentut', 'ian kentut', 'ian kentut'];
  const colors = ['#ff142e','#dc143c','#ff0033','#b22222','#ff5c70'];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    makeHeart();
    stars = Array.from({length: Math.max(35, Math.floor(w*h/11000))}, () => ({
      x: Math.random()*w, y: Math.random()*h, phase: Math.random()*Math.PI*2,
      size: 2 + Math.random()*4
    }));
  }
  function heartPoint(t) {
    return { x: 16*Math.pow(Math.sin(t),3),
      y: -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t)) };
  }
  function makeHeart() {
    particles = [];
    const scale = Math.min(w/42, h/34, 17);
    const cx = w/2, cy = h/2 - Math.min(18, h*.025);
    const add = (x,y) => particles.push({
      x: cx+x*scale, y: cy+y*scale, word: words[Math.floor(Math.random()*words.length)],
      color: colors[Math.floor(Math.random()*colors.length)], phase: Math.random()*6.28,
      size: Math.max(8, Math.min(13, w/34)), delay: Math.random()*75
    });
    for(let i=0;i<210;i++) {
      const p=heartPoint(i/210*Math.PI*2); add(p.x,p.y);
    }
    for(let i=0;i<190;i++) {
      const p=heartPoint(Math.random()*Math.PI*2), r=Math.sqrt(Math.random())*.88;
      add(p.x*r,p.y*r);
    }
  }
  function drawHeartText(p, alpha, scale=1) {
    ctx.save(); ctx.globalAlpha=alpha; ctx.translate(p.x,p.y); ctx.scale(scale,scale);
    ctx.font=`bold ${p.size}px Arial`; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.shadowColor=p.color; ctx.shadowBlur=10; ctx.fillStyle=p.color;
    ctx.fillText(p.word,0,0); ctx.restore();
  }
  function loop() {
    frame++;
    ctx.clearRect(0,0,w,h);
    const beat = 1 + .025*Math.sin(frame*.055);
    // stars twinkle
    for(const s of stars) {
      const a=.25+.65*(.5+.5*Math.sin(frame*.045+s.phase));
      ctx.globalAlpha=a; ctx.fillStyle='#ffc1d0'; ctx.shadowColor='#ff4775'; ctx.shadowBlur=12;
      ctx.font=`${s.size+4}px Arial`; ctx.textAlign='center'; ctx.fillText('✦',s.x,s.y);
    }
    // falling hearts
    if(Math.random()<.055) falling.push({x:Math.random()*w,y:-20,v:1+Math.random()*2.1,size:12+Math.random()*12,a:.65+Math.random()*.3});
    falling.forEach(f=>{
      f.y+=f.v; ctx.globalAlpha=f.a; ctx.fillStyle='#ff4c78'; ctx.shadowColor='#ff174f'; ctx.shadowBlur=12;
      ctx.font=`${f.size}px Arial`; ctx.fillText('♥',f.x,f.y);
    });
    falling=falling.filter(f=>f.y<h+30);
    // text particles form a pulsing heart
    for(const p of particles) {
      const a=Math.min(1,Math.max(0,(frame-p.delay)/22));
      if(a>0) drawHeartText({x:w/2+(p.x-w/2)*beat,y:h/2+(p.y-h/2)*beat,...p},a,beat);
    }
    ctx.globalAlpha=1; ctx.shadowColor='#ff7897'; ctx.shadowBlur=24;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    const titleSize=Math.min(31, Math.max(17, w/19));
    ctx.font=`bold ${titleSize}px Georgia`;
    ctx.fillStyle='#ffe5eb';
    ctx.fillText('ian kambing i hate u',w/2,h/2+Math.min(8,h*.012),w*.88);
    ctx.shadowBlur=0; ctx.globalAlpha=1;
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize',resize);
  resize(); loop();
})();
</script>
</body>
</html>
